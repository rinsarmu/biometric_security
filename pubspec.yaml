name: biometric_security
description: "Unified biometric security for Flutter: hardware-backed key management, biometric-gated encrypted storage, app-lock, and availability detection on Android and iOS."
version: 0.1.12
homepage: https://github.com/roberaensermu/biometric_security
repository: https://github.com/roberaensermu/biometric_security
issue_tracker: https://github.com/roberaensermu/biometric_security/issues

topics:
  - biometrics
  - security
  - authentication
  - encryption
  - keystore

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Federated-plugin base class for the platform interface.
  plugin_platform_interface: ^2.1.8
  # Well-established authenticated encryption (AES-256-GCM) for the software data
  # layer only. Hardware keys never pass through it (see SECURITY.md, INV-2).
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# The following section is specific to Flutter plugins.
flutter:
  plugin:
    platforms:
      android:
        package: com.robera.biometric_security
        pluginClass: BiometricSecurityPlugin
      ios:
        pluginClass: BiometricSecurityPlugin
